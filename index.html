<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Discovery Agent | وكيل اكتشاف الفرص الرقمية</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        #responseMessage {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>وكيل اكتشاف الفرص الرقمية</h1>
    <p class="intro">املأ النموذج أدناه لطلب فحص موقعك وتحليل أداء المبيعات والفرص التسويقية.</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="customerName">اسم العميل أو النشاط التجاري:</label>
            <input type="text" id="customerName" required placeholder="مثال: مطعم الشام">
        </div>

        <div class="form-group">
            <label for="customerEmail">البريد الإلكتروني:</label>
            <input type="email" id="customerEmail" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="customerPhone">رقم الهاتف:</label>
            <input type="tel" id="customerPhone" required placeholder="مثال: +963911111111">
        </div>

        <div class="form-group">
            <label for="financialCompany">الشركة المالية / طريقة الدفع:</label>
            <select id="financialCompany" required>
                <option value="">اختر الشركة أو القناة المالية</option>
                <option value="Syriatel Cash">سيريتل كاش (Syriatel Cash)</option>
                <option value="MTN Cash">إم تي إن كاش (MTN Cash)</option>
                <option value="Bemo Bank">بنك بيمو (Bemo Bank)</option>
                <option value="International Wire">تحويل دولي / أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="planName">اختر الباقة المطلوبة:</label>
            <select id="planName" required>
                <option value="باقة الفحص السريع">باقة الفحص السريع</option>
                <option value="الباقة الشاملة المتقدمة">الباقة الشاملة المتقدمة</option>
                <option value="باقة استشارة النمو للأعمال">باقة استشارة النمو للأعمال</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paymentReceiptRef">رقم مرجع الدفع / رقم الإيصال:</label>
            <input type="text" id="paymentReceiptRef" required placeholder="أدخل رقم عملية التحويل أو الإيصال">
        </div>

        <button type="submit">إرسال الطلب وبدء المراجعة</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const customerName = document.getElementById('customerName').value;
        const customerEmail = document.getElementById('customerEmail').value;
        const customerPhone = document.getElementById('customerPhone').value;
        const financialCompany = document.getElementById('financialCompany').value;
        const planName = document.getElementById('planName').value;
        const paymentReceiptRef = document.getElementById('paymentReceiptRef').value;
        const responseDiv = document.getElementById('responseMessage');

        responseDiv.style.display = 'block';
        responseDiv.className = '';
        responseDiv.innerText = 'جاري إرسال الطلب...';

        try {
            const res = await fetch('/api/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customerName,
                    customerEmail,
                    customerPhone,
                    financialCompany,
                    planName,
                    paymentReceiptRef
                })
            });

            const data = await res.json();

            if (data.success) {
                responseDiv.className = 'success';
                responseDiv.innerText = data.message + ' (رقم الطلب: ' + data.orderId + ')';
                document.getElementById('orderForm').reset();
            } else {
                responseDiv.className = 'error';
                responseDiv.innerText = 'حدث خطأ: ' + data.message;
            }
        } catch (err) {
            responseDiv.className = 'error';
            responseDiv.innerText = 'فشل الاتصال بالخادم. يجدر التحقق من الاتصال.';
        }
    });
</script>

</body>
</html>
