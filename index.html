<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Discovery Agent - وكيل اكتشاف الفرص</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 90vh; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
        .chat-header { background: #2563eb; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
        .user-message { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-left-radius: 2px; }
        .agent-message { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-right-radius: 2px; }
        .input-box { display: flex; padding: 10px; background: #0f172a; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 Opportunity Discovery Agent v1.0
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message agent-message">مرحباً بك! أنا وكيل اكتشاف الفرص والمبيعات.
أرسل لي رابط أي موقع إلكتروني (مثال: example.com) وسأقوم بفحص سرعته واستخراج بيانات التواصل وتحديد فرصة التحسين المتاحة لك.</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="أدخل رابط الموقع هنا...">
        <button id="sendBtn">إرسال</button>
    </div>
</div>

<script>
    const inputField = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
        const message = inputField.value.trim();
        if (!message) return;

        appendMessage(message, 'user-message');
        inputField.value = '';

        const isUrl = message.includes('.') && !message.includes(' ');

        if (isUrl) {
            appendMessage('🔍 جاري فحص الموقع واستخراج البيانات والفرص...', 'agent-message');
            try {
                const res = await fetch(`/api/scan?url=${encodeURIComponent(message)}`);
                const data = await res.json();

                if (data.error) {
                    appendMessage(`❌ خطأ: ${data.error}`, 'agent-message');
                } else {
                    let report = `📊 تقرير فحص الفرصة:
• الرابط: ${data.url}
• زمن التحميل: ${data.loadTimeSeconds}
• تقييم الأداء: ${data.isSlow ? '⚠️ بطيء (تحتاج تحسين الأداء)' : '✅ سريع وممتاز'}
• البريد الإلكتروني: ${data.emails.length > 0 ? data.emails.join(', ') : 'غير متوفر'}
• الهواتف: ${data.phones.length > 0 ? data.phones.join(', ') : 'غير متوفر'}

🎯 التوصية المقترحة للمبيعات:
${data.isSlow ? 'تواصل مع صاحب الموقع وعرض خدمة تسريع الأداء للرفع من نسبة المبيعات!' : 'الموقع أداؤه ممتاز، يمكن عرض خدمات التسويق وإدارة الحملات الإعلانية.'}`;

                    appendMessage(report, 'agent-message');
                }
            } catch (err) {
                appendMessage('❌ تعذر الاتصال بالسيرفر لفحص الموقع.', 'agent-message');
            }
        } else {
            appendMessage('يرجى كتابة رابط موقع صريح (مثل: google.com) لتنفيذ عملية الفحص.', 'agent-message');
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
