<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Discovery Agent | وكيل اكتشاف الفرص الرقمية</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        #responseMessage {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>وكيل اكتشاف الفرص الرقمية</h1>
    <p class="intro">امْلأ النموذج أدناه لطلب فحص موقعك وتحليل أداء المبيعات والفرص التسويقية.</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="customerName">الاسم الكامل</label>
            <input type="text" id="customerName" required placeholder="أدخل اسمك الكامل">
        </div>

        <div class="form-group">
            <label for="customerEmail">البريد الإلكتروني</label>
            <input type="email" id="customerEmail" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="customerPhone">رقم الهاتف</label>
            <input type="text" id="customerPhone" required placeholder="09xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="financialCompany">الشركة المالية / طريقة الدفع</label>
            <select id="financialCompany" required>
                <option value="">اختر الشركة أو أداة المالية</option>
                <option value="Stripe">Stripe (الدفع الإلكتروني الآمن)</option>
                <option value="Syriatel Cash">سيريتل كاش (Syriatel Cash)</option>
                <option value="MTN Cash">إم تى إن كاش (MTN Cash)</option>
                <option value="Bemo Bank">بنك بيمو (Bemo Bank)</option>
                <option value="International Wire">تحويل دولي / أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="planName">اختر الباقة المطلوبة</label>
            <select id="planName" required>
                <option value="التفحص السريع">الباقة السريعة - تفحص الفحص السريع</option>
                <option value="الباقة الشاملة المتقدمة">الباقة الشاملة المتقدمة - تحليل الأداء</option>
                <option value="استشارة النمو الأعمال">استشارة النمو الأعمال - باقة الاستشارات</option>
            </select>
        </div>

        <button type="submit">الانتقال إلى الدفع الآمن عبر Stripe</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script>
document.getElementById('orderForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const customerName = document.getElementById('customerName').value;
    const customerEmail = document.getElementById('customerEmail').value;
    const customerPhone = document.getElementById('customerPhone').value;
    const financialCompany = document.getElementById('financialCompany').value;
    const planName = document.getElementById('planName').value;
    const responseDiv = document.getElementById('responseMessage');

    responseDiv.style.display = 'block';
    responseDiv.className = '';
    responseDiv.innerText = 'جاري توجيهك إلى بوابة الدفع الآمنة...';

    try {
        const res = await fetch('/api/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerName,
                customerEmail,
                customerPhone,
                financialCompany,
                planName
            })
        });

        const data = await res.json();

        if (data.url) {
            // توجيه العميل مباشرة إلى صفحة الدفع الخاصة بـ Stripe
            window.location.href = data.url;
        } else {
            responseDiv.className = 'error';
            responseDiv.innerText = data.error || 'حدث خطأ أثناء إنشاء جلسة الدفع.';
        }
    } catch (err) {
        responseDiv.className = 'error';
        responseDiv.innerText = 'فشل الاتصال بالخادم، يرجى التحقق من الاتصال.';
    }
});
</script>

</body>
</html>
