<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الوكيل | Agent Dashboard</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .order-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-info h3 {
            margin: 0 0 10px 0;
            color: #2980b9;
        }
        .order-info p {
            margin: 5px 0;
            color: #555;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #27ae60;
        }
        .refresh-btn {
            background-color: #3498db;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        .no-orders {
            text-align: center;
            color: #888;
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم الوكيل</h1>
    <p style="text-align: center; color: #666;">إدارة واعتماد طلبات العملاء المعلقة بانتظار تأكيد الدفع.</p>
    
    <button class="refresh-btn" onclick="loadPendingOrders()">تحديث الطلبات</button>
    
    <div id="ordersContainer">
        <p style="text-align: center;">جاري تحميل الطلبات المعلقة...</p>
    </div>
</div>

<script>
    async function loadPendingOrders() {
        const container = document.getElementById('ordersContainer');
        container.innerHTML = '<p style="text-align: center;">جاري التحديث...</p>';

        try {
            const response = await fetch('/api/agent/pending-orders');
            const data = await response.json();

            if (data.success) {
                if (data.orders.length === 0) {
                    container.innerHTML = '<div class="no-orders">لا توجد طلبات معلقة حالياً. جميع الطلبات معتمدة.</div>';
                    return;
                }

                let html = '';
                data.orders.forEach(order => {
                    html += `
                        <div class="order-card" id="order-${order.orderId}">
                            <div class="order-info">
                                <h3>رقم الطلب: ${order.orderId}</h3>
                                <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                                <p><strong>البريد الإلكتروني:</strong> ${order.customerEmail}</p>
                                <p><strong>الباقة:</strong> ${order.planName}</p>
                                <p><strong>مرجع الدفع:</strong> <span style="color: #e74c3c;">${order.paymentReceiptRef}</span></p>
                                <p><strong>تاريخ الطلب:</strong> ${new Date(order.createdAt).toLocaleString('ar-SA')}</p>
                            </div>
                            <div>
                                <button onclick="approveOrder('${order.orderId}')">اعتماد وبدء العمل</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p style="text-align: center; color: red;">فشل في جلب الطلبات.</p>';
            }
        } catch (err) {
            container.innerHTML = '<p style="text-align: center; color: red;">خطأ في الاتصال بالخادم.</p>';
        }
    }

    async function approveOrder(orderId) {
        if (!confirm(`هل أنت متأكد من اعتماد الطلب ${orderId} وبدء تشغيل الوكيل؟`)) {
            return;
        }

        try {
            const response = await fetch('/api/agent/approve-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId })
            });

            const data = await response.json();

            if (data.success) {
                alert(data.message);
                // إزالة كرت الطلب من القائمة مباشرة
                document.getElementById(`order-${orderId}`).remove();
                
                // إذا لم يتبق شيء، أظهر رسالة عدم وجود طلبات
                const container = document.getElementById('ordersContainer');
                if (container.children.length === 0) {
                    container.innerHTML = '<div class="no-orders">لا توجد طلبات معلقة حالياً. جميع الطلبات معتمدة.</div>';
                }
            } else {
                alert('حدث خطأ: ' + data.message);
            }
        } catch (err) {
            alert('فشل الاتصال بالخادم.');
        }
    }

    // تحميل الطلبات تلقائياً عند فتح الصفحة
    loadPendingOrders();
</script>

</body>
</html>
